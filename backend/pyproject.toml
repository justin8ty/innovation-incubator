[project]
name = "innovation-incubator-backend"
version = "0.1.0"
description = "FastAPI backend for Innovation Incubator"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pymupdf",
    "google-generativeai",
    "python-multipart",
    "python-docx",
    "python-dotenv",
    "sqlalchemy",
    "alembic",
    "sqlite-vec>=0.1.9",
    "google-cloud-aiplatform>=1.148.1",
    "docx>=0.2.4",
    "exceptiongroup>=1.3.1",
    "numpy>=2.4.5",
    "shapely>=2.1.2",
    "vertexai>=1.43.0",
]

[tool.uv]
package = false
