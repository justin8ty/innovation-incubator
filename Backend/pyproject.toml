[project]
name = "innovation-incubator-backend"
version = "0.1.0"
description = "FastAPI backend for Innovation Incubator"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi",
    "google-auth",
    "google-cloud-speech",
    "google-generativeai",
    "google-cloud-aiplatform",
    "moviepy",
    "pymupdf",
    "python-docx",
    "python-dotenv",
    "python-multipart",
    "sqlite-vec",
    "uvicorn[standard]",
]

[tool.uv]
package = false
